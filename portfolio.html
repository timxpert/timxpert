.pf-hero{padding:8rem 0 4.5rem}
.pf-hero h1{font-size:clamp(2.6rem,7vw,5rem);margin-bottom:1.2rem}
.pf-hero .intro{color:var(--muted);max-width:50ch;font-size:1.08rem;margin:0}
.pf-head{display:grid;grid-template-columns:1fr 1.1fr;gap:3rem;align-items:center}
.reel{all:unset;cursor:pointer;position:relative;display:block;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:var(--navy-3)}
.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:scale .6s var(--ease)}
.reel:hover img{scale:1.03}
.reel:focus-visible{outline:2px solid var(--lav);outline-offset:4px}
.play{position:absolute;left:50%;top:50%;translate:-50% -50%;width:76px;height:76px;border-radius:50%;background:var(--blue);display:grid;place-items:center;transition:scale .3s var(--ease)}
.play::after{content:"";margin-left:5px;border-left:18px solid var(--ink);border-top:11px solid transparent;border-bottom:11px solid transparent}
.reel:hover .play{scale:1.08}
.reel .tag{position:absolute;left:1rem;bottom:1rem;background:#fff;color:var(--ink);font-size:.8rem;font-weight:600;padding:.4rem .85rem;border-radius:999px}
@media (max-width:860px){.pf-head{grid-template-columns:1fr;gap:2rem}.pf-hero{padding:7rem 0 3.5rem}}

:root{--ease:cubic-bezier(.32,.72,0,1)}
.chips{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;margin:0 -1.25rem 2.5rem;padding:0 1.25rem}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-weight:600;font-size:.92rem;padding:.6rem 1.05rem;border-radius:999px;border:1.5px solid #ddd6e6;background:#fff;color:var(--ink);cursor:pointer;transition:background .2s,color .2s,border-color .2s,scale .2s}
.chip:active{scale:.95}
.chip small{font-size:.78rem;color:var(--grey);margin-left:.3rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-pressed="true"] small{color:#bdb3c9}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.2rem 1.4rem}
.card{all:unset;cursor:pointer;display:block;-webkit-tap-highlight-color:transparent}
.card .th{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--sw,#e7c4fe)}
.card .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:scale .6s var(--ease)}
.card .th .ph{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:1.3rem;letter-spacing:-.02em;color:#fff;padding:1rem;text-align:center}
.card .play{width:54px;height:54px;opacity:0;scale:.8;transition:opacity .3s,scale .35s var(--ease)}
.card .play::after{border-left-width:14px;border-top-width:9px;border-bottom-width:9px;margin-left:4px}
.card:hover .th img{scale:1.04}
.card:hover .play,.card:focus-visible .play{opacity:1;scale:1}
.card:focus-visible .th{outline:2px solid var(--deep);outline-offset:3px}
.card b{display:block;margin-top:.8rem;font-size:1.05rem;font-weight:700;line-height:1.3}
.card span.m{font-size:.86rem;color:var(--grey)}
.card.in{animation:in .5s var(--ease) both;animation-delay:calc(var(--k) * 40ms)}
@keyframes in{from{opacity:0;translate:0 14px}}
@media (max-width:900px){.grid{grid-template-columns:1fr 1fr;gap:1.8rem 1rem}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
@media (hover:none){.card .play{opacity:1;scale:1}}
.cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.2rem;margin-top:5rem;padding-top:2.5rem;border-top:1px solid #e6e1ec}

.paper .btn{background:var(--ink);color:#fff}

<script>

const modal=document.getElementById("modal"), media=document.getElementById("m-media"), scrim=document.getElementById("scrim");
const EASE="cubic-bezier(.32,.72,0,1)", calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function play(title, sub, vimeo){
  media.innerHTML=`<iframe src="https://player.vimeo.com/video/${vimeo}?${VIMEO_KEYS[vimeo]?"h="+VIMEO_KEYS[vimeo]+"&":""}autoplay=1&playsinline=1&title=0&byline=0&portrait=0&dnt=1" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen title="${esc(title)}"></iframe>`;
  document.getElementById("m-title").textContent=title; document.getElementById("m-sub").textContent=sub;
  modal.showModal(); scrim.classList.add("on");
  if(!calm) modal.animate([{opacity:0,transform:"translateY(24px) scale(.97)"},{opacity:1,transform:"none"}],{duration:480,easing:EASE});
}
function close(){ if(!modal.open) return; scrim.classList.remove("on");
  const a=modal.animate([{opacity:1},{opacity:0,transform:calm?"none":"translateY(16px) scale(.98)"}],{duration:calm?120:260,easing:EASE});
  a.onfinish=()=>{ modal.close(); media.innerHTML=""; }; }
modal.addEventListener("cancel",e=>{e.preventDefault();close();});
modal.addEventListener("click",e=>{ if(e.target===modal||e.target.closest(".x")) close(); });

const COLORS=["#8134be","#572088","#c160ff","#26074b","#d99bfe"];
const types=["All",...new Set(PROJECTS.map(p=>p.type))];
const chips=document.getElementById("chips"), grid=document.getElementById("grid");
chips.innerHTML=types.map((t,i)=>`<button class="chip" type="button" aria-pressed="${i===0}" data-t="${esc(t)}">${esc(t)}<small>${t==="All"?PROJECTS.length:PROJECTS.filter(p=>p.type===t).length}</small></button>`).join("");
function show(t){
  const list=PROJECTS.map((p,i)=>[p,i]).filter(([p])=>t==="All"||p.type===t);
  grid.innerHTML=list.map(([p,i],k)=>`<button class="card in" type="button" data-i="${i}" style="--k:${k};--sw:${COLORS[i%COLORS.length]}">
    <div class="th"><span class="ph">${esc(p.t)}</span>${p.img?`<img src="${p.img}" alt="" width="640" height="360" loading="lazy" decoding="async" onerror="this.remove()">`:""}<span class="play"></span></div>
    <b>${esc(p.t)}</b><span class="m">${esc(p.type)} · ${esc(p.ind)}</span></button>`).join("");
}
show("All");
chips.addEventListener("click",e=>{ const c=e.target.closest(".chip"); if(!c) return;
  chips.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c)); show(c.dataset.t); });
grid.addEventListener("click",e=>{ const c=e.target.closest(".card"); if(!c) return; const p=PROJECTS[+c.dataset.i];
  play(p.t, p.type+" · "+p.ind, p.vimeo); });
document.getElementById("reel").addEventListener("click",()=>play("Showreel","Explainers, product demos and launch videos",SHOWREEL_VIMEO_ID));
document.getElementById("yr").textContent=new Date().getFullYear();
// Hamburger menu: grows out of the button, links slide in one by one
const burger=document.getElementById("burger"), menu=document.getElementById("menu");
function setMenu(open){
  const r=burger.getBoundingClientRect();
  menu.style.setProperty("--mx",(r.left+r.width/2)+"px"); menu.style.setProperty("--my",(r.top+r.height/2)+"px");
  document.documentElement.classList.toggle("menu-open",open);
  burger.setAttribute("aria-expanded",open); burger.setAttribute("aria-label",open?"Close menu":"Open menu");
  menu.inert=!open;
  if(open) setTimeout(()=>menu.querySelector("a.item")?.focus({preventScroll:true}),350);
}
burger.addEventListener("click",()=>setMenu(!document.documentElement.classList.contains("menu-open")));
menu.addEventListener("click",e=>{ if(e.target.closest("a")) setMenu(false); });
addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.documentElement.classList.contains("menu-open")){ setMenu(false); burger.focus(); } });

</script>
